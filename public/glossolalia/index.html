<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glossolalia</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    overflow: hidden;
    font-family: "Noto Sans Mono", "Symbola", "Segoe UI Symbol", "Apple Symbols", monospace;
    cursor: none;
  }

  #grid {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    display: grid;
    align-content: start;
  }

  #grid span {
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.1s linear;
    opacity: 0;
    line-height: 1;
    overflow: hidden;
  }

  #hud {
    position: fixed;
    bottom: 12px;
    left: 12px;
    color: rgba(255,255,255,0.35);
    font-family: monospace;
    font-size: 11px;
    line-height: 1.6;
    pointer-events: none;
    z-index: 10;
    transition: opacity 0.5s;
  }

  #hud.hidden { opacity: 0; }

  #title-overlay {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: rgba(255,255,255,0.08);
    font-family: monospace;
    font-size: 10vw;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    pointer-events: none;
    z-index: 1;
    white-space: nowrap;
  }
</style>
</head>
<body>

<div id="title-overlay">Glossolalia</div>
<div id="grid"></div>
<div id="hud"></div>

<script>
(() => {
  // --- CONFIG ---
  const state = {
    fontSize: 18,
    tickInterval: 60,
    pitchRange: 1.0,
    baseFreq: 80,
    waveform: 0,
    colorMode: 0,
    paused: false,
    muted: false,
    hueOffset: 0,
    volume: 0.08,
    decayTime: 3000,
    cellsPerTick: 0, // computed
  };

  const WAVEFORMS = ['sine', 'square', 'sawtooth', 'triangle'];
  const COLOR_MODES = ['random', 'monochrome', 'hue-drift', 'fire', 'ice'];

  // Interesting unicode ranges (curated for visual variety)
  const RANGES = [
    [0x0021, 0x007E],   // Basic Latin
    [0x00A1, 0x00FF],   // Latin Supplement
    [0x0100, 0x024F],   // Latin Extended
    [0x0370, 0x03FF],   // Greek
    [0x0400, 0x04FF],   // Cyrillic
    [0x0530, 0x058F],   // Armenian
    [0x0590, 0x05FF],   // Hebrew
    [0x0600, 0x06FF],   // Arabic
    [0x0900, 0x097F],   // Devanagari
    [0x0E00, 0x0E7F],   // Thai
    [0x1000, 0x109F],   // Myanmar
    [0x10A0, 0x10FF],   // Georgian
    [0x1100, 0x11FF],   // Hangul Jamo
    [0x13A0, 0x13FF],   // Cherokee
    [0x2000, 0x206F],   // General Punctuation
    [0x2070, 0x209F],   // Super/Subscripts
    [0x20A0, 0x20CF],   // Currency Symbols
    [0x2100, 0x214F],   // Letterlike Symbols
    [0x2150, 0x218F],   // Number Forms
    [0x2190, 0x21FF],   // Arrows
    [0x2200, 0x22FF],   // Mathematical Operators
    [0x2300, 0x23FF],   // Misc Technical
    [0x2500, 0x257F],   // Box Drawing
    [0x2580, 0x259F],   // Block Elements
    [0x25A0, 0x25FF],   // Geometric Shapes
    [0x2600, 0x26FF],   // Misc Symbols
    [0x2700, 0x27BF],   // Dingbats
    [0x2800, 0x28FF],   // Braille
    [0x2E80, 0x2EFF],   // CJK Radicals
    [0x3000, 0x303F],   // CJK Symbols
    [0x3040, 0x309F],   // Hiragana
    [0x30A0, 0x30FF],   // Katakana
    [0x4E00, 0x4E9F],   // CJK (small slice)
    [0xA000, 0xA02F],   // Yi Syllables (slice)
    [0xFB50, 0xFB9F],   // Arabic Pres. Forms
    [0xFE30, 0xFE4F],   // CJK Compatibility Forms
    [0x1D100, 0x1D1FF], // Musical Symbols
    [0x1F300, 0x1F3FF], // Misc Symbols & Pictographs
    [0x1F600, 0x1F64F], // Emoticons
    [0x1F680, 0x1F6FF], // Transport Symbols
    [0x1F900, 0x1F9FF], // Supplemental Symbols
    [0x2F800, 0x2FA1F], // CJK Compatibility Ideographs
  ];

  // Pre-build flat codepoint list
  const allCodepoints = [];
  for (const [lo, hi] of RANGES) {
    for (let cp = lo; cp <= hi; cp++) allCodepoints.push(cp);
  }

  function randomCodepoint() {
    return allCodepoints[Math.floor(Math.random() * allCodepoints.length)];
  }

  // --- GRID ---
  const gridEl = document.getElementById('grid');
  const hudEl = document.getElementById('hud');
  let cells = [];
  let cols = 0, rows = 0;

  function buildGrid() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    const size = state.fontSize;
    cols = Math.floor(w / (size * 0.62));
    rows = Math.floor(h / (size * 1.15));
    const total = cols * rows;

    gridEl.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    gridEl.style.fontSize = size + 'px';
    gridEl.innerHTML = '';
    cells = [];

    for (let i = 0; i < total; i++) {
      const span = document.createElement('span');
      span.textContent = ' ';
      span.style.opacity = '0';
      gridEl.appendChild(span);
      cells.push({ el: span, birth: 0, codepoint: 0 });
    }

    state.cellsPerTick = Math.max(1, Math.floor(total * 0.04));
  }

  // --- COLOR ---
  function pickColor(cp) {
    switch (COLOR_MODES[state.colorMode]) {
      case 'random':
        return `hsl(${Math.random() * 360}, ${70 + Math.random() * 30}%, ${50 + Math.random() * 30}%)`;
      case 'monochrome':
        const l = 40 + Math.random() * 55;
        return `hsl(0, 0%, ${l}%)`;
      case 'hue-drift':
        state.hueOffset = (state.hueOffset + 0.3) % 360;
        return `hsl(${state.hueOffset + Math.random() * 40}, ${70 + Math.random() * 30}%, ${50 + Math.random() * 25}%)`;
      case 'fire':
        return `hsl(${Math.random() * 50}, ${80 + Math.random() * 20}%, ${40 + Math.random() * 35}%)`;
      case 'ice':
        return `hsl(${190 + Math.random() * 50}, ${60 + Math.random() * 40}%, ${50 + Math.random() * 35}%)`;
      default:
        return '#fff';
    }
  }

  // --- AUDIO ---
  let audioCtx = null;
  let masterGain = null;

  function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = state.volume;

    // Add a compressor to tame the chaos slightly
    const compressor = audioCtx.createDynamicsCompressor();
    compressor.threshold.value = -30;
    compressor.ratio.value = 12;
    compressor.attack.value = 0.003;
    compressor.release.value = 0.1;

    masterGain.connect(compressor);
    compressor.connect(audioCtx.destination);
  }

  function playCodepoint(cp) {
    if (state.muted || !audioCtx) return;

    // Map codepoint to frequency: normalize to 0..1 then scale
    const normalized = cp / 0x10FFFF;
    const freq = state.baseFreq + normalized * 2000 * state.pitchRange;

    const osc = audioCtx.createOscillator();
    const env = audioCtx.createGain();

    osc.type = WAVEFORMS[state.waveform];
    osc.frequency.value = freq;

    // Very short grain
    const now = audioCtx.currentTime;
    const duration = 0.03 + Math.random() * 0.08;
    env.gain.setValueAtTime(0.001, now);
    env.gain.exponentialRampToValueAtTime(0.3, now + 0.005);
    env.gain.exponentialRampToValueAtTime(0.001, now + duration);

    osc.connect(env);
    env.connect(masterGain);
    osc.start(now);
    osc.stop(now + duration + 0.01);
  }

  // --- TICK ---
  let lastTick = 0;
  let animFrame;

  function tick(timestamp) {
    animFrame = requestAnimationFrame(tick);

    if (state.paused) return;

    // Decay existing cells
    const now = performance.now();
    for (const cell of cells) {
      if (cell.birth > 0) {
        const age = now - cell.birth;
        const opacity = Math.max(0, 1 - age / state.decayTime);
        cell.el.style.opacity = opacity;
        if (opacity <= 0) {
          cell.birth = 0;
          cell.el.textContent = ' ';
        }
      }
    }

    // Place new characters at interval
    if (now - lastTick < state.tickInterval) return;
    lastTick = now;

    for (let i = 0; i < state.cellsPerTick; i++) {
      const idx = Math.floor(Math.random() * cells.length);
      const cell = cells[idx];
      const cp = randomCodepoint();
      const char = String.fromCodePoint(cp);

      cell.el.textContent = char;
      cell.el.style.color = pickColor(cp);
      cell.el.style.opacity = '1';
      cell.birth = now;
      cell.codepoint = cp;

      playCodepoint(cp);
    }
  }

  // --- HUD ---
  let hudTimeout;
  function updateHud() {
    hudEl.classList.remove('hidden');
    hudEl.innerHTML = [
      `<b>GLOSSOLALIA</b>`,
      `speed: ${state.tickInterval}ms &nbsp; grid: ${cols}×${rows} (${cells.length})`,
      `pitch: ×${state.pitchRange.toFixed(1)} &nbsp; wave: ${WAVEFORMS[state.waveform]} &nbsp; color: ${COLOR_MODES[state.colorMode]}`,
      `decay: ${(state.decayTime/1000).toFixed(1)}s &nbsp; ${state.paused ? 'PAUSED' : 'RUNNING'} &nbsp; ${state.muted ? 'MUTED' : 'AUDIO ON'}`,
      ``,
      `<span style="opacity:0.5">↑↓ speed · ←→ pitch · +/- size · D decay · W wave · C color · M mute · Space pause · H hide</span>`,
    ].join('<br>');

    clearTimeout(hudTimeout);
    hudTimeout = setTimeout(() => hudEl.classList.add('hidden'), 5000);
  }

  // --- KEYBOARD ---
  document.addEventListener('keydown', (e) => {
    initAudio(); // Unlock audio on first interaction

    switch(e.key) {
      case 'ArrowUp':
        state.tickInterval = Math.max(10, state.tickInterval - 10);
        break;
      case 'ArrowDown':
        state.tickInterval = Math.min(500, state.tickInterval + 10);
        break;
      case 'ArrowRight':
        state.pitchRange = Math.min(4.0, state.pitchRange + 0.1);
        break;
      case 'ArrowLeft':
        state.pitchRange = Math.max(0.1, state.pitchRange - 0.1);
        break;
      case '+': case '=':
        state.fontSize = Math.max(6, state.fontSize - 2);
        buildGrid();
        break;
      case '-': case '_':
        state.fontSize = Math.min(60, state.fontSize + 2);
        buildGrid();
        break;
      case ' ':
        e.preventDefault();
        state.paused = !state.paused;
        break;
      case 'm': case 'M':
        state.muted = !state.muted;
        break;
      case 'w': case 'W':
        state.waveform = (state.waveform + 1) % WAVEFORMS.length;
        break;
      case 'c': case 'C':
        state.colorMode = (state.colorMode + 1) % COLOR_MODES.length;
        break;
      case 'd': case 'D':
        state.decayTime = state.decayTime >= 8000 ? 1000 : state.decayTime + 1000;
        break;
      case 'h': case 'H':
        hudEl.classList.toggle('hidden');
        return; // Don't re-show hud
      default:
        return;
    }
    updateHud();
  });

  // Click to unlock audio too
  document.addEventListener('click', () => initAudio());

  // --- INIT ---
  buildGrid();
  updateHud();
  window.addEventListener('resize', () => { buildGrid(); updateHud(); });
  animFrame = requestAnimationFrame(tick);
})();
</script>
</body>
</html>
