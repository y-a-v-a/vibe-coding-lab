<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Boy Camera</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #222;
            font-family: monospace;
            color: #9BBC0F;
        }
        
        #container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        
        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            border: 8px solid #8BAC0F;
            background: #0F380F;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        
        button {
            padding: 10px 20px;
            background: #306230;
            color: #9BBC0F;
            border: 2px solid #8BAC0F;
            cursor: pointer;
            font-family: monospace;
            font-size: 14px;
        }
        
        button:hover {
            background: #8BAC0F;
            color: #0F380F;
        }
    </style>
</head>
<body>
    <div id="container">
        <h1>Game Boy Camera</h1>
        <canvas id="display" width="160" height="144"></canvas>
        <button id="startBtn">Start Camera</button>
    </div>
    
    <video id="video" style="display: none;"></video>

    <script>
        const canvas = document.getElementById('display');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const video = document.getElementById('video');
        const startBtn = document.getElementById('startBtn');
        
        // Game Boy palette
        const palette = [
            [15, 56, 15],    // #0F380F (darkest)
            [48, 98, 48],    // #306230
            [139, 172, 15],  // #8BAC0F
            [155, 188, 15]   // #9BBC0F (lightest)
        ];
        
        function rgbToGrayscale(r, g, b) {
            return 0.299 * r + 0.587 * g + 0.114 * b;
        }
        
        function findClosestColor(gray) {
            const paletteGrays = palette.map(([r, g, b]) => rgbToGrayscale(r, g, b));
            let closest = 0;
            let minDiff = Math.abs(gray - paletteGrays[0]);
            
            for (let i = 1; i < paletteGrays.length; i++) {
                const diff = Math.abs(gray - paletteGrays[i]);
                if (diff < minDiff) {
                    minDiff = diff;
                    closest = i;
                }
            }
            return palette[closest];
        }
        
        function processFrame() {
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            
            for (let i = 0; i < data.length; i += 4) {
                const gray = rgbToGrayscale(data[i], data[i + 1], data[i + 2]);
                const [r, g, b] = findClosestColor(gray);
                data[i] = r;
                data[i + 1] = g;
                data[i + 2] = b;
            }
            
            ctx.putImageData(imageData, 0, 0);
            requestAnimationFrame(processFrame);
        }
        
        startBtn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 160, height: 144 } 
                });
                video.srcObject = stream;
                video.play();
                video.onloadedmetadata = () => {
                    processFrame();
                    startBtn.style.display = 'none';
                };
            } catch (err) {
                alert('Camera access denied: ' + err.message);
            }
        });
    </script>
</body>
</html>
